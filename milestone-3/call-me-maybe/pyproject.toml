[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling en LLMs pequenos mediante decodificacion restringida"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.2",
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.9",
    "flake8>=7.0",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_missing_imports = true



[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
