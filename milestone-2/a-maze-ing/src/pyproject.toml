[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
authors = [
    { name="nfodere-", email="nfodere-@student.42barcelona.com" },
    { name="lfleitas", email="lfleitas@student.42barcelona.com" }
]
description = "A-Maze-ing generator and solver package."
readme = "README.md"
requires-python = ">=3.10"

# Dependencias principales (obligatorias para que el paquete funcione)
dependencies = [
    "pydantic==2.12.5",
]

# Dependencias opcionales (para desarrollo, evaluación y linting)
[project.optional-dependencies]
dev = [
    "flake8==7.3.0",
    "mypy==1.19.1",
    "build==1.4.0",
    "types-setuptools==82.0.0.20260210",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["maze*"]

[[tool.mypy.overrides]]
module = "mlx.*"
ignore_missing_imports = true